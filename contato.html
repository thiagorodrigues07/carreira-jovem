<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carreira Jovem - Contato</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>

  <header class="cabecalho">
    <nav class="menu">
      <a href="index.html" class="logo">Carreira Jovem</a>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="oportunidades.html">Oportunidades</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="contato.html" class="ativo">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="secao">
      <div class="container">
        <h1>Fale com a gente</h1>
        <p class="secao-subtitulo">Preencha o formulario para tirar duvidas ou se candidatar</p>
      </div>

      <form class="form-caixa" action="#" method="post">

        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required />
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required />
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" />
        </div>

        <div class="campo">
          <label for="assunto">Assunto</label>
          <select id="assunto" name="assunto" required>
            <option value="">Selecione uma opcao</option>
            <option value="estagio">Estagio</option>
            <option value="curso">Curso</option>
            <option value="evento">Evento</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="campo">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem" required></textarea>
        </div>

        <div class="campo-checkbox">
          <input type="checkbox" id="aceite" name="aceite" required />
          <label for="aceite">Concordo em ser contatado(a) por e-mail</label>
        </div>

        <button type="submit" class="botao">Enviar mensagem</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <div class="rodape-conteudo">
      <div>
        <p><strong>Carreira Jovem</strong></p>
        <p>Portal academico de oportunidades em tecnologia.</p>
      </div>
      <div class="rodape-links">
        <a href="index.html">Inicio</a>
        <a href="oportunidades.html">Oportunidades</a>
        <a href="sobre.html">Sobre</a>
        <a href="https://www.gov.br/pt-br/servicos/emprega-brasil" target="_blank" rel="noopener">Portal Emprega Brasil (gov.br)</a>
      </div>
    </div>
    <p class="rodape-copy">Projeto academico - UNICSUL</p>
  </footer>

</body>
</html>
